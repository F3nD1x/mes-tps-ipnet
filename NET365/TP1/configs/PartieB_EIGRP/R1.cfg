!
!
!

!
upgrade fpd auto
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R1
!
boot-start-marker
boot-end-marker
!
logging message-counter syslog
!
no aaa new-model
ip source-route
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface FastEthernet0/0
 description LAN-SIEGE
 ip address 192.168.10.1 255.255.255.0
 duplex half
!
interface FastEthernet1/0
 description Vers R2
 ip address 10.10.12.1 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet1/1
 description Vers R3
 ip address 10.10.13.1 255.255.255.252
 delay 1000
 duplex auto
 speed auto
!
router eigrp 200
 passive-interface FastEthernet0/0
 network 10.10.12.0 0.0.0.3
 network 10.10.13.0 0.0.0.3
 network 192.168.10.0
 no auto-summary
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
!
!
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
gatekeeper
 shutdown
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
end
